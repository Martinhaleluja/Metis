# Render Blueprint for the Metis AI gateway.
#
# Lives at the repository root because Render looks for it there. The Docker
# build context is the root too, so the Metis.Core project reference resolves —
# the gateway shares its entitlement rules with the desktop client rather than
# reimplementing them.
#
# Staging and production are two services in one file. That is the whole of the
# environment separation: same image, different secrets, and neither can reach
# the other's database.
#
# The website is no longer here. It moved to Vercel, which is a better fit for a
# single-page app with client routing than a static bucket is, and its config
# now lives in website/vercel.json. Whatever hosts it, its two VITE_ variables
# are browser-visible by design and end up inside the JavaScript bundle.

services:
  - type: web
    name: metis-gateway
    runtime: docker
    dockerfilePath: ./src/Metis.Api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /health
    envVars:
      - key: METIS_ENV
        value: production
      # Render routes to port 10000 by default. The Dockerfile says the same
      # number; the blueprint's value wins at runtime, so a mismatch between the
      # two is silent until someone runs the image by hand.
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000

      # Which browsers may call this service. The gateway spends money, so it
      # never allows any origin — an empty list means only the desktop app,
      # which is not subject to CORS, can reach it.
      - key: ALLOWED_ORIGINS
        sync: false

      # sync: false means Render prompts for the value and keeps it out of this
      # file. Every one of these is a secret and none belongs in the repository.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

      # The private half of the key that signs entitlement snapshots, as base64
      # PKCS#8. Without it /v1/me still answers, but unsigned — so a desktop
      # client will not trust a cached plan while it is offline. Generate a pair
      # with EntitlementSigner.GenerateKeyPair and put the public half in
      # MetisBackend.EntitlementPublicKey.
      - key: METIS_ENTITLEMENT_SIGNING_KEY
        sync: false

      # Optional. Setting one of these is all it takes to start serving that
      # provider on Metis's account; until then it is refused with a reason
      # rather than silently missing.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

      # Webhook signing secrets. Both verifiers ship, and both are inert until
      # their secret is set — so choosing a payment processor is a matter of
      # filling one of these in. See docs/BILLING_SETUP.md.
      - key: POLAR_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Taking payment, as opposed to being told about one. The webhook secret
      # above lets the gateway *receive* a subscription; these let it *start*
      # one, which is what POST /v1/checkout does. All five are optional: without
      # the token, or without the product id for the plan being bought, that
      # endpoint answers 404 and nothing else about the service changes. A
      # deployment with none of them set is a gateway that serves AI and sells
      # nothing, which is what staging should be until it deliberately is not.
      - key: POLAR_ACCESS_TOKEN
        sync: false
      # "sandbox" for Polar's test environment; anything else is the real one,
      # with real cards. Set it explicitly on staging rather than relying on the
      # default, which is production.
      - key: POLAR_SERVER
        sync: false
      - key: POLAR_PRODUCT_PRO
        sync: false
      - key: POLAR_PRODUCT_MAX
        sync: false
      # Where a customer is returned once they have paid. Read from here rather
      # than from the request, because a redirect the caller chooses is an open
      # redirect next to a payment form.
      - key: METIS_SITE_URL
        sync: false

# One service, not two.
#
# There used to be a staging pair here, pinned to `main` and with the second
# suspended. Both were wrong in a way that would have been very quiet: `main`
# still carries an older four-file gateway that builds, boots and answers
# /health with a 200 -- but has no webhook route, no checkout and no cost
# protection. Deploying it would have looked completely healthy while silently
# never applying a payment.
#
# feat/launch-website has since been merged, so `main` now holds the current
# gateway and this points back at it.
#
# The name matters too: it is the hostname, and it is compiled into the desktop
# app at MetisBackend.DefaultGatewayUrl. Renaming this service without changing
# that constant orphans every installed copy of Metis.
